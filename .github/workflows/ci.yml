name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  build-musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: pip install cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p sip-faxd
      - name: Verify static linking
        run: |
          BIN=target/${{ matrix.target }}/release/sip-faxd
          file "$BIN"
          file "$BIN" | grep -q "statically linked"
      - run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  smoke-rhel:
    needs: build-musl
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["rockylinux/rockylinux:9", "almalinux:10"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - name: Unpack and run in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ${{ matrix.image }} sh -euxc '
            mkdir /opt/fax && cd /opt/fax
            tar xzf /dist/*.tar.gz --strip-components=1
            ./sip-faxd --version
            ./sip-faxd --help
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, smoke-rhel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
