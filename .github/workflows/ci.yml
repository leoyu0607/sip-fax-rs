name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # t4 oracle tests need libtiff/poppler; they run for real in the e2e-spandsp container job.
  T4_ORACLE: skip

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Protocol crate gate (docs/test-plans/M1.md section 0): sip-core line coverage >= 85 %.
      - run: cargo llvm-cov -p sip-core --fail-under-lines 85
      # fax-in (M1d): non-protocol crate gate, line coverage >= 70 %.
      - run: cargo llvm-cov -p fax-in --fail-under-lines 70
      # Fax protocol crates (M2, docs/design/fax-stack.md section 0): line coverage >= 85 %.
      - run: cargo llvm-cov -p t38 --fail-under-lines 85
      - run: cargo llvm-cov -p t4 --fail-under-lines 85
      - run: cargo llvm-cov -p t30 --fail-under-lines 85
      # store (M3a): non-protocol crate gate, line coverage >= 80 % (SQLite run). The three server
      # drivers (postgres, mysql, mssql: about 600 lines that only run against a server, M3b review)
      # are left out of this number; the db-matrix job runs the same suite on them.
      - run: cargo llvm-cov -p store --fail-under-lines 80 --ignore-filename-regex 'backend[\\/](mssql|mysql|postgres)\.rs'

  # M3a: the store behaviour suite on the four server databases (SQLite runs in `test`).
  # Required check names: "db-matrix (postgres)", "db-matrix (mysql)", "db-matrix (mariadb)", "db-matrix (mssql)".
  db-matrix:
    name: db-matrix (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            image: postgres:16
            port: 5432
            health: pg_isready -U postgres -h 127.0.0.1
            url: postgres://postgres:Sipfax_Test_1@127.0.0.1:5432/postgres
          - db: mysql
            image: mysql:8.0
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -pSipfax_Test_1 --silent
            url: mysql://root:Sipfax_Test_1@127.0.0.1:3306/mysql
          - db: mariadb
            image: mariadb:11
            port: 3306
            health: mariadb-admin ping -h 127.0.0.1 -uroot -pSipfax_Test_1 --silent
            url: mariadb://root:Sipfax_Test_1@127.0.0.1:3306/mysql
          - db: mssql
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            health: /opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P Sipfax_Test_1 -Q 'SELECT 1'
            url: mssql://sa:Sipfax_Test_1@127.0.0.1:1433/master?trust_server_certificate=true
    services:
      db:
        image: ${{ matrix.image }}
        # Every image ignores the variables of the others.
        env:
          POSTGRES_PASSWORD: Sipfax_Test_1
          MYSQL_ROOT_PASSWORD: Sipfax_Test_1
          MARIADB_ROOT_PASSWORD: Sipfax_Test_1
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sipfax_Test_1
          TZ: Asia/Taipei
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Store suite on ${{ matrix.db }} (S01-S11, R01-R08)
        env:
          SIP_FAXD_TEST_DB: ${{ matrix.url }}
          TZ: Asia/Taipei
        run: |
          # S11 stops and restarts the service container to prove the pool reconnects.
          export SIP_FAXD_TEST_DB_CONTAINER=$(docker ps -q --filter "ancestor=${{ matrix.image }}" | head -1)
          echo "service container: $SIP_FAXD_TEST_DB_CONTAINER"
          cargo test -p store -- --test-threads=4

  build-musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: pip install cargo-zigbuild
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p sip-faxd
      - name: Verify static linking
        run: |
          BIN=target/${{ matrix.target }}/release/sip-faxd
          file "$BIN"
          file "$BIN" | grep -q "statically linked"
      # sip-faxd links the store crate since M3b; this also builds and runs the store test executable
      # (sqlx with bundled SQLite and tiberius with rustls, statically linked on musl).
      - name: Verify store crate links statically (M3a)
        run: |
          EXE=$(cargo zigbuild --release --locked --target ${{ matrix.target }} -p store --tests --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | head -1)
          file "$EXE"
          file "$EXE" | grep -q "statically linked"
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then "$EXE" --test-threads=4; fi
      - run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  smoke-rhel:
    needs: build-musl
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["rockylinux/rockylinux:9", "almalinux:10"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - name: Unpack and run in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ${{ matrix.image }} sh -euxc '
            mkdir /opt/fax && cd /opt/fax
            tar xzf /dist/*.tar.gz --strip-components=1
            ./sip-faxd --version
            ./sip-faxd --help
          '

  e2e-spandsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/test-rocky9.Dockerfile
          platforms: linux/amd64
          load: true
          tags: sip-fax-rs-test:rocky9
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Also builds the main workspace (sip-faxd) inside the container for the SIPp interop tests.
      - name: tools workspace (fmt, clippy, test) in Rocky 9 container
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work/tools \
            -e CARGO_TARGET_DIR=/work/target/docker \
            -e RUSTFLAGS="-D warnings" \
            sip-fax-rs-test:rocky9 \
            bash -euxc 'cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test -- --nocapture && cd /work && cargo test -p t4 --test oracle'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, coverage, db-matrix, smoke-rhel, e2e-spandsp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
