[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["tools", "crates/sip-core/fuzz", "crates/t38/fuzz", "crates/t4/fuzz", "crates/t30/fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/leoyu0607/sip-fax-rs"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
# sip-core (ADR-008). tokio / tracing are declared now and first used by the transport phase (M1b).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
rand = "0.9"
md-5 = "0.10"
proptest = "1"
# fax-in / sip-faxd (ADR-013)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
sip-core = { path = "crates/sip-core" }
fax-in = { path = "crates/fax-in" }
# store (M3a, ADR-003): sqlx for SQLite/PostgreSQL/MySQL, tiberius for MSSQL; rustls only, SQLite bundled.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "mysql", "chrono"] }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "chrono", "tds73"] }
bb8 = "0.9"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
percent-encoding = "2"
tempfile = "3"
tokio-util = { version = "0.7", features = ["compat"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
