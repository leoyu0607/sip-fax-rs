[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/leoyu0607/sip-fax-rs"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
