[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["tools", "crates/sip-core/fuzz", "crates/t38/fuzz", "crates/t4/fuzz", "crates/t30/fuzz", "crates/fax-in/fuzz", "crates/fax-modem/fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/leoyu0607/sip-fax-rs"

[workspace.dependencies]
# web (M4b, ADR-056): HTTP/HTTPS with rustls (ring provider), self-signed certificates
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws", "original-uri"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["set-header", "limit", "timeout"] }
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
x509-parser = { version = "0.18", default-features = false }
if-addrs = "0.13"
# TUI (M4d, ADR pending): pure Rust terminal UI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
# sip-core (ADR-008). tokio / tracing are declared now and first used by the transport phase (M1b).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
rand = "0.9"
md-5 = "0.10"
proptest = "1"
# fax-in / sip-faxd (ADR-013)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
sip-core = { path = "crates/sip-core" }
fax-in = { path = "crates/fax-in" }
# store (M3a, ADR-003): sqlx for SQLite/PostgreSQL/MySQL, tiberius for MSSQL; rustls only, SQLite bundled.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "mysql", "chrono"] }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "chrono", "tds73"] }
bb8 = "0.9"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
percent-encoding = "2"
# M4a (proposed ADR): hot-swappable configuration snapshot, JSON error paths, password hashing, secret encryption
arc-swap = "1"
ring = "0.17"
base64 = "0.22"
argon2 = "0.5"
serde_path_to_error = "0.1"
tempfile = "3"
tokio-util = { version = "0.7", features = ["compat"] }
# t4 PNG preview output (M3e, proposed ADR): pure Rust, MIT/Apache-2.0
png = "0.18"

# delivery (M3c): lettre (SMTP) and reqwest (webhook) with rustls only; HMAC-SHA256 for webhook signatures.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
hmac = "0.13"
sha2 = "0.11"

# sip-faxd service management (M4d, proposed ADR): flock / setsid / kill without unsafe code,
# gzip of rotated log files. Both were already in the lock file through tempfile and png.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# password hashing is far too slow unoptimised (m = 19 MiB); keep debug builds usable
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.rust-argon2]
opt-level = 3
[profile.dev.package.blake2b_simd]
opt-level = 3
