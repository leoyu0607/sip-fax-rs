[package]
name = "fax-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "SpanDSP-based fax simulation: T.38 / G.711 loopback runners and TIFF test pages"

[dependencies]
spandsp-sys = { path = "../spandsp-sys" }
sip-core = { path = "../../crates/sip-core" }
t38 = { path = "../../crates/t38" }
t30 = { path = "../../crates/t30" }
t4 = { path = "../../crates/t4" }
fax-in = { path = "../../crates/fax-in" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

[dev-dependencies]
interop = { path = "../interop" }
serde_json = "1"
