[package]
name = "fax-in-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace so that stable `cargo build/test --workspace`
# never needs nightly or libfuzzer.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
fax-in = { path = ".." }

[[bin]]
name = "audio_rx"
path = "fuzz_targets/audio_rx.rs"
test = false
doc = false
bench = false
