[package]
name = "fax-modem-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace so that stable `cargo build/test --workspace`
# never needs nightly or libfuzzer.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
fax-modem = { path = ".." }

[[bin]]
name = "hdlc_deframe"
path = "fuzz_targets/hdlc_deframe.rs"
test = false
doc = false
bench = false
