[package]
name = "t4-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Own workspace: excluded from the main workspace so that stable `cargo build/test --workspace`
# never needs nightly or libfuzzer.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
t4 = { path = ".." }

[[bin]]
name = "t4_decode"
path = "fuzz_targets/t4_decode.rs"
test = false
doc = false
bench = false
